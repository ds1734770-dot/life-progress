<!DOCTYPE html>
<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Progress — Phase 8.1 Prototype (DEMO)</title>
<!--
  ============================================================================
  PHASE 8.1 — "THE PAPER LOG" VISUAL PROTOTYPE
  ============================================================================
  DESIGN ARTIFACT ONLY.
  - NOT the production app. NOT connected to production in any way.
  - All data on this page is DEMO DATA held in page memory only.
  - Self-contained: own CSS + JS, no dependencies, no production imports.
  - Views: launch, dashboard, water, gym, goals, journal, history,
    achievements, settings + avatar sheet, badge panel, toasts.
  ============================================================================
-->
<style>
/* ============================================================
   TOKENS — "The Paper Log"
   ============================================================ */
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --font-serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --r-s:6px; --r-m:10px; --r-l:14px;
  --d-fast:100ms; --d-base:180ms; --d-slow:320ms;
  --ease:cubic-bezier(.2,0,0,1);
}
html[data-theme="ink"]{
  --bg:#121110; --bg-raised:#1a1918; --surface:#201e1c; --surface-2:#292624;
  --text:#ece7df; --text-2:#a8a094; --text-3:#7a7268;
  --divider:#2b2825; --border:#332f2b;
  --ember:#e8863a; --ember-press:#d97a30; --ember-dim:rgba(232,134,58,.14);
  --on-ember:#231206;
  --water:#7fb4c9; --gym:#c98a7f; --goals:#a5b87f; --journal:#c9b27f;
  --success:#8fbc7f; --warning:#d9b36a; --danger:#d97b6c; --info:#9db8d9;
  --achieve:#d9c08a;
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --scrim:rgba(8,7,6,.62);
  color-scheme:dark;
  --app-frame:#000;
}
html[data-theme="paper"]{
  --bg:#f5f1ea; --bg-raised:#efe9e0; --surface:#fbf8f3; --surface-2:#f0eae1;
  --text:#26221d; --text-2:#6b6357; --text-3:#948b7d;
  --divider:#e2dbd0; --border:#dcd4c8;
  --ember:#c05f1e; --ember-press:#a85116; --ember-dim:rgba(192,95,30,.10);
  --on-ember:#fff;
  --water:#4d7f96; --gym:#96543f; --goals:#64783c; --journal:#8a6d35;
  --success:#4e7a42; --warning:#9c6d1c; --danger:#b04a35; --info:#4a6a94;
  --achieve:#8a6d2a;
  --shadow:0 1px 2px rgba(38,34,29,.08);
  --scrim:rgba(38,34,29,.5);
  color-scheme:light;
  --app-frame:#e6e0d6;
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);font-size:15px;line-height:1.55;
  background:var(--app-frame);color:var(--text);
  -webkit-font-smoothing:antialiased;display:flex;justify-content:center;
  min-height:100dvh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
::selection{background:var(--ember);color:var(--on-ember)}

/* Phone frame */
.phone{
  position:relative;width:100%;max-width:420px;min-height:100dvh;
  background:var(--bg);display:flex;flex-direction:column;
}
@media (min-width:520px){
  body{padding:28px 0}
  .phone{min-height:calc(100dvh - 56px);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.25)}
}

/* Prototype ribbon — always visible, never confusable with production */
.ribbon{
  position:sticky;top:0;z-index:30;
  background:var(--bg-raised);border-bottom:1px solid var(--border);
  padding:5px 16px;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--achieve);
}

/* View container */
.view{flex:1;padding:20px 20px 110px;width:100%}
.view-inner{max-width:420px}

/* ============================================================
   TYPE ROLES
   ============================================================ */
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.page-title{font-family:var(--font-serif);font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.page-sub{font-size:13px;color:var(--text-2);margin-top:4px}
.section{margin-top:32px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-link{font-size:13px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:2px}
.section-link:hover{color:var(--text)}
.serif-num{font-family:var(--font-serif);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}

/* ============================================================
   BUTTONS — squared, print-like
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:var(--r-s);
  font-size:15px;font-weight:600;white-space:nowrap;
  transition:background var(--d-fast) var(--ease),border-color var(--d-fast) var(--ease),color var(--d-fast) var(--ease),filter var(--d-fast) var(--ease);
}
.btn:active{filter:brightness(.9)}
.btn-primary{background:var(--ember);color:var(--on-ember)}
.btn-primary:active{background:var(--ember-press);filter:none}
.btn-outline{border:1px solid var(--border);color:var(--text);background:var(--surface)}
.btn-outline:active{background:var(--surface-2);filter:none}
.btn-quiet{color:var(--text-2);padding:8px 10px}
.btn-quiet:active{color:var(--text)}
.btn-danger-text{color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px}
.icon-btn{
  width:38px;height:38px;border-radius:var(--r-s);border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease);
}
.icon-btn:active{background:var(--surface-2);color:var(--text)}

/* ============================================================
   CARDS, LISTS, ROWS
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--divider);width:100%;text-align:left;
  transition:background var(--d-fast) var(--ease);
}
.row:last-child{border-bottom:none}
button.row:active,div.row[role="button"]:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row-value{font-family:var(--font-serif);font-size:17px;font-variant-numeric:tabular-nums}
.chev{color:var(--text-3);flex:none}

/* ============================================================
   CHIPS (filters only — rectangular)
   ============================================================ */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:8px 14px;border-radius:var(--r-s);border:1px solid var(--border);
  background:var(--surface);font-size:13px;font-weight:600;color:var(--text-2);
  transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease),border-color var(--d-fast) var(--ease);
}
.chip:active{background:var(--surface-2)}
.chip[aria-pressed="true"],.chip.active{background:var(--text);border-color:var(--text);color:var(--bg)}

/* ============================================================
   BOTTOM NAV — flat full-width bar, ember underline
   ============================================================ */
.tabbar{
  position:sticky;bottom:0;z-index:20;margin-top:auto;
  display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));
}
.tab{
  flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 5px;color:var(--text-3);
  transition:color var(--d-base) var(--ease);
}
.tab .tab-label{font-size:10.5px;font-weight:600;letter-spacing:.01em}
.tab.active{color:var(--text)}
.tab.active .tab-label{font-weight:700}
.tab.active::before{
  content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:28px;height:2px;border-radius:1px;background:var(--ember);
}

/* ============================================================
   RING
   ============================================================ */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring{transform:rotate(-90deg)}
.ring-track{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring-fill{fill:none;stroke:var(--ember);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset var(--d-slow) var(--ease)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ============================================================
   BARS
   ============================================================ */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:30px;background:var(--surface-2);border-radius:3px 3px 0 0;transition:height var(--d-slow) var(--ease)}
.bar.met{background:var(--water)}
.bar-label{font-size:10px;font-weight:600;color:var(--text-3)}
.bar-value{font-size:10px;font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}

/* ============================================================
   DASHBOARD
   ============================================================ */
.day-head{display:flex;align-items:center;gap:12px}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.avatar svg{width:100%;height:100%}
.day-head-actions{display:flex;gap:8px;margin-left:auto}
.day-title{margin-top:20px}
.done-line{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--text-2)}
.done-line .ok{color:var(--ember);font-weight:700}
.done-line .no{color:var(--text-3)}
.today-card{display:flex;align-items:center;gap:20px;margin-top:20px}
.today-checks{flex:1;min-width:0;display:flex;flex-direction:column}
.today-check{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--divider);font-size:14px}
.today-check:last-child{border-bottom:none}
.today-check .t-label{flex:1;color:var(--text-2)}
.today-check .t-state{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.today-check.is-done .t-state{color:var(--ember)}
.today-check .tick{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-strong,var(--border));
  display:flex;align-items:center;justify-content:center;flex:none;color:transparent;
}
.today-check.is-done .tick{background:var(--ember);border-color:var(--ember);color:var(--on-ember)}

/* ============================================================
   GOALS
   ============================================================ */
.goal-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--divider)}
.goal-row:last-child{border-bottom:none}
.goal-check{
  position:relative;flex:none;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--border);margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:transparent;
  transition:background var(--d-base) var(--ease),border-color var(--d-base) var(--ease);
}
.goal-check svg{width:14px;height:14px}
.goal-check svg path{stroke:var(--on-ember);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset var(--d-base) var(--ease) var(--d-fast)}
.goal-row.done .goal-check{background:var(--ember);border-color:var(--ember)}
.goal-row.done .goal-check svg path{stroke-dashoffset:0}
.goal-row.done .goal-title{text-decoration:line-through;color:var(--text-3)}
.goal-title{font-weight:600;overflow-wrap:anywhere}
.goal-meta{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:12px;color:var(--text-2)}
.cat-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pulse-ring{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ember);opacity:0;pointer-events:none}
.goal-row.just-done .pulse-ring{animation:pulse .32s var(--ease)}
@keyframes pulse{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}

/* ============================================================
   WATER
   ============================================================ */
.water-hero{display:flex;align-items:center;gap:20px;margin-top:20px}
.water-big{font-family:var(--font-serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.water-target-line{font-size:13px;color:var(--text-2);margin-top:6px}
.quick-add{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.entries-time{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:13px}

/* ============================================================
   GYM
   ============================================================ */
.stat-line{display:flex;margin-top:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m)}
.stat-cell{flex:1;text-align:center;padding:14px 4px;border-right:1px solid var(--divider)}
.stat-cell:last-child{border-right:none}
.stat-cell .v{font-family:var(--font-serif);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-cell .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.resume-card{border-left:3px solid var(--ember)}
.tpl-name{font-family:var(--font-serif);font-size:18px;font-weight:600}
.pr-value{font-family:var(--font-serif);font-size:17px;font-variant-numeric:tabular-nums}

/* ============================================================
   JOURNAL
   ============================================================ */
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--border);border-radius:var(--r-s);background:var(--surface);outline:none;transition:border-color var(--d-fast) var(--ease)}
.search input:focus{border-color:var(--ember)}
.j-title{font-family:var(--font-serif);font-size:17px;font-weight:600}
.j-preview{font-size:13px;color:var(--text-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.j-meta{font-size:12px;color:var(--text-3);margin-top:5px}

/* ============================================================
   HISTORY
   ============================================================ */
.hist-nav{display:flex;align-items:center;gap:8px}
.hist-month{flex:1;text-align:center;font-family:var(--font-serif);font-size:20px;font-weight:600}
.hist-week{display:grid;grid-template-columns:repeat(7,1fr);margin-top:16px}
.hist-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px}
.hist-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.hist-day{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:5px 0 6px;min-height:44px;border-radius:var(--r-s);
}
.hist-day:active{background:var(--surface-2)}
.hist-daynum{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.hist-day.out{opacity:.3}
.hist-day.is-today .hist-daynum{box-shadow:inset 0 0 0 1.5px var(--ember);color:var(--ember);font-weight:700}
.hist-day.selected{background:var(--ember-dim)}
.hist-dots{display:flex;gap:3px;min-height:5px}
.hist-dot{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--divider)}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-3)}

/* ============================================================
   ACHIEVEMENTS
   ============================================================ */
.ach-bar{height:2px;background:var(--surface-2);border-radius:1px;overflow:hidden;margin-top:14px}
.ach-bar-fill{height:100%;background:var(--ember);transition:width var(--d-slow) var(--ease)}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.ach-card{
  display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  padding:16px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);
  transition:background var(--d-fast) var(--ease);
}
.ach-card:active{background:var(--surface-2)}
.ach-card.locked{opacity:.55}
.ach-title{font-size:13px;font-weight:700}
.ach-req{font-size:11px;color:var(--text-3);font-weight:600}
.badge-art{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badge-art svg{width:64px;height:64px}
.badge-art .glyph{position:absolute;width:26px;height:26px;color:var(--achieve)}
.ach-card.locked .glyph{color:var(--text-3)}

/* ============================================================
   SETTINGS
   ============================================================ */
.settings-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--divider);width:100%;text-align:left}
.settings-row:last-child{border-bottom:none}
button.settings-row:active{background:var(--surface-2)}
.switch{position:relative;width:44px;height:26px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);flex:none;transition:background var(--d-base) var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text-3);transition:transform var(--d-base) var(--ease),background var(--d-base) var(--ease)}
.switch.on{background:var(--ember);border-color:var(--ember)}
.switch.on::after{transform:translateX(18px);background:var(--on-ember)}

/* ============================================================
   SHEET / DIALOG / TOAST / LAUNCH
   ============================================================ */
.sheet-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade var(--d-fast) var(--ease)}
.sheet{
  width:100%;max-width:420px;max-height:86dvh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-bottom:none;
  border-radius:var(--r-l) var(--r-l) 0 0;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));
  animation:slideup var(--d-base) var(--ease);
  overscroll-behavior:contain;
}
.sheet-grabber{width:36px;height:4px;border-radius:2px;background:var(--surface-2);margin:6px auto 16px}
.sheet-title{font-family:var(--font-serif);font-size:22px;font-weight:600;margin-bottom:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}

.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 16px}
.avatar-option{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--border);background:var(--surface-2);padding:0}
.avatar-option.selected{border-color:var(--ember);box-shadow:0 0 0 3px var(--ember-dim)}
.avatar-option svg,.avatar-option .initials{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}

.badge-panel{text-align:center;padding-top:4px}
.badge-panel .big{width:88px;height:88px;margin:6px auto 10px;position:relative}
.badge-panel .big svg{width:88px;height:88px}
.badge-panel .big .glyph{width:36px;height:36px}
.unlocked-tag{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ember);margin-top:8px}
.badge-name{font-family:var(--font-serif);font-size:26px;font-weight:600;margin-top:4px}
.badge-req{font-size:13px;font-weight:600;color:var(--text-2);margin-top:2px}
.badge-desc{font-size:13px;line-height:1.6;color:var(--text-2);margin-top:12px}
.badge-earned{font-size:11px;font-weight:700;color:var(--text-3);margin-top:12px}

.toast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:70;
  display:flex;align-items:center;gap:8px;max-width:calc(100vw - 48px);
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:10px 16px;border-radius:var(--r-m);font-size:13px;font-weight:600;
  box-shadow:var(--shadow);animation:toastin var(--d-base) var(--ease);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.toast svg{color:var(--ember);flex:none}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* Launch — flat ink field, serif voice */
.launch{
  position:fixed;inset:0;z-index:80;background:var(--bg);
  display:flex;align-items:center;justify-content:center;

const CAT_COLOR={Health:'var(--goals)',Productivity:'var(--info)',Personal:'var(--journal)',Fitness:'var(--gym)'};

/* ============================================================

   ============================================================ */
const state={view:'dashboard',histMonth:0,histSelected:null};
const TABS=[

const VIEWS=['dashboard','water','gym','goals','journal','history','achievements','settings'];

function renderTabbar(){
  const bar=document.getElementById('tabbar');
  bar.innerHTML=TABS.map(t=>'<button class="tab'+(state.view===t.route?' active':'')+'" data-route="'+t.route+'" aria-label="'+t.label+'"'+(state.view===t.route?' aria-current="page"':'')+'>'+icon(t.icon,22)+'<span class="tab-label">'+t.label+'</span></button>').join('');

function go(view){
  if(!VIEWS.includes(view))view='dashboard';
  state.view=view;
  if(location.hash!=='#/'+view)history.replaceState(null,'','#/'+view);
  render();
}
function render(){
  renderTabbar();
  const inner=document.getElementById('view-inner');
  inner.classList.remove('view-enter');void inner.offsetWidth;inner.classList.add('view-enter');
  ({dashboard:vDashboard,water:vWater,gym:vGym,goals:vGoals,journal:vJournal,history:vHistory,achievements:vAchievements,settings:vSettings}[state.view])();

/* ============================================================

   ============================================================ */
function fmtL(ml){return (ml/1000).toFixed(1).replace(/\.0$/,'')+' L';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){
  const root=document.getElementById('toast-root');
  root.innerHTML='<div class="toast">'+icon('check',15)+esc(msg)+'</div>';
  clearTimeout(toast._t);toast._t=setTimeout(()=>{root.innerHTML='';},2200);
}
function setRing(el,frac){
  const fill=el.querySelector('.ring-fill');
  const C=2*Math.PI*62;
  fill.style.strokeDasharray=C;
  fill.style.strokeDashoffset=C*(1-Math.max(0,Math.min(1,frac)));
}
function ringMarkup(size,label,sub){
  return '<div class="ring-wrap" style="width:'+size+'px;height:'+size+'px">'+
    '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 140 140">'+
    '<circle class="ring-track" cx="70" cy="70" r="62"/>'+
    '<circle class="ring-fill" cx="70" cy="70" r="62" stroke-dasharray="389.6" stroke-dashoffset="389.6"/></svg>'+
    '<div class="ring-center"><div class="serif-num" style="font-size:34px">'+label+'</div>'+
    '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-top:2px">'+sub+'</div></div></div>';
}
function catDot(cat){return '<span class="cat-dot" style="background:'+(CAT_COLOR[cat]||'var(--text-3)')+'"></span>';}
function openSheet(html){
  const root=document.getElementById('sheet-root');
  root.innerHTML='<div class="sheet-backdrop"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-grabber"></div>'+html+'</div></div>';
  root.querySelector('.sheet-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeSheet();});
  bind(root.querySelector('.sheet'));
}
function closeSheet(){document.getElementById('sheet-root').innerHTML='';}
function avatarMarkup(size){
  if(demo.user.avatar){
    return '<div class="avatar" style="width:'+size+'px;height:'+size+'px">'+demo.user.avatar+'</div>';
  }
  const initial=(demo.user.name||'A').trim().charAt(0).toUpperCase();
  return '<div class="avatar" style="width:'+size+'px;height:'+size+'px"><span>'+esc(initial)+'</span></div>';
}
function overall(){
  const goalsDone=demo.goals.filter(g=>g.done&&g.due==='Today').length;
  const goalsToday=demo.goals.filter(g=>g.due==='Today').length||1;
  const parts={
    goals:goalsDone/goalsToday,
    water:Math.min(1,demo.water.total/demo.water.target),
    gym:0,journal:1,
  };
  const pct=Math.round(((parts.goals+parts.water+parts.gym+parts.journal)/4)*100);
  return {pct,parts};
}

function vWater(){

/* ============================================================
   EVENT WIRING
   ============================================================ */
function bind(root){
  root.querySelectorAll('[data-act]').forEach(node=>{
    node.addEventListener('click',onAct);
  });
}
function onAct(e){
  const btn=e.currentTarget;
  const act=btn.dataset.act;
  const d=btn.dataset;
  switch(act){
    case 'go':go(d.to);break;
    case 'toast':toast(d.msg||'Prototype only');break;
    case 'chip':{
      const wrap=btn.closest('.chips');
      wrap.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===btn));
      break;
    }
    case 'add-water':{
      demo.water.total+=Number(d.ml);
      demo.water.today.push({t:new Date().toTimeString().slice(0,5),ml:Number(d.ml)});
      if(demo.water.total>=demo.water.target)toast('Water goal reached');
      else toast('+'+d.ml+' ml added');
      vWater();
      break;
    }
    case 'del-water':{
      const entry=demo.water.today.splice(Number(d.i),1)[0];
      demo.water.total=Math.max(0,demo.water.total-entry.ml);
      toast('Entry removed');vWater();
      break;
    }
    case 'toggle-goal':{
      const g=demo.goals.find(x=>x.id===d.id);
      g.done=!g.done;
      if(g.done)toast('Goal completed');
      vGoals();
      break;
    }
    case 'start-tpl':toast('“'+d.name+'” session is out of prototype scope');break;
    case 'hist-prev':state.histMonth=(state.histMonth+HIST_MONTHS.length-1)%HIST_MONTHS.length;state.histSelected=null;vHistory();break;
    case 'hist-next':state.histMonth=(state.histMonth+1)%HIST_MONTHS.length;state.histSelected=null;vHistory();break;
    case 'hist-day':state.histSelected=Number(d.day);vHistory();break;
    case 'badge':openBadgeSheet(demo.achievements[Number(d.i)]);break;
    case 'avatar':openAvatarSheet();break;
    case 'pick-avatar':{
      const v=d.v;
      demo.user.avatar=v===''?null:Number(v);
      document.querySelectorAll('.avatar-option').forEach(o=>o.classList.remove('selected'));
      btn.classList.add('selected');
      break;
    }
    case 'close-sheet':closeSheet();break;
    case 'theme':{
      document.documentElement.dataset.theme=d.t;
      try{localStorage.setItem('proto-theme',d.t);}catch(_e){}
      vSettings();
      break;
    }
    case 'switch':{
      btn.classList.toggle('on');
      btn.setAttribute('aria-checked',btn.classList.contains('on'));
      break;
    }
  }
}

/* ============================================================
   LAUNCH — flat ink field, serif voice, once per visit
   ============================================================ */
function playLaunch(){
  const root=document.getElementById('launch-root');
  root.innerHTML=
    '<div class="launch" id="launch" role="dialog" aria-label="Life Progress">'+
      '<div class="launch-inner">'+
        '<div class="launch-mark">'+icon('droplet',34)+'</div>'+
        '<div class="launch-quote">Small progress is still progress.</div>'+
        '<div class="launch-rule"></div>'+
        '<div class="launch-brand">Life Progress</div>'+
      '</div>'+
      '<button class="launch-skip">Tap anywhere to continue</button>'+
    '</div>';
  const el=root.querySelector('.launch');
  let closed=false;
  const close=()=>{
    if(closed)return;closed=true;
    el.classList.add('leaving');
    setTimeout(()=>{root.innerHTML='';},260);
  };
  el.addEventListener('click',close);
  setTimeout(close,2600);
}

/* ============================================================
   BOOT
   ============================================================ */
try{
  const t=localStorage.getItem('proto-theme');
  if(t==='paper'||t==='ink')document.documentElement.dataset.theme=t;
}catch(_e){}

const initialHash=(location.hash||'').replace('#/','');
if(VIEWS.includes(initialHash)){
  state.view=initialHash; // screenshots: skip launch when a view is requested
  render();
}else{
  render();
  playLaunch();
}
window.addEventListener('hashchange',()=>{
  const v=(location.hash||'').replace('#/','');
  if(VIEWS.includes(v)&&v!==state.view){state.view=v;render();}
});
</script>
